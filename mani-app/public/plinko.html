<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DREAM 66 - Plinko 1000 Luxury</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }
        body {
            background: radial-gradient(circle at center, #1f013b 0%, #080014 100%);
            color: #fff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            left: 0;
            top: 0;
        }

        .game-container {
            width: 100%;
            max-width: 410px;
            height: 100%;
            max-height: 720px;
            background: rgba(15, 3, 30, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #2a0845, #120124);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn {
            background: linear-gradient(135deg, #ff1f40, #b3002d);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            text-decoration: none;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(255, 31, 64, 0.6);
        }
        .title {
            font-size: 15px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }
        .balance-box { font-size: 13px; color: #00ffcc; font-weight: 900; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

        #plinkoCanvas {
            background: radial-gradient(circle, #1a0636 0%, #060012 100%);
            border-radius: 14px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
            border: 1.5px solid rgba(255, 215, 0, 0.3);
            width: 100%;
            max-width: 370px;
            height: 260px;
        }

        .status-banner {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .settings-bar {
            width: 100%;
            display: flex;
            gap: 8px;
        }
        .setting-box {
            flex: 1;
            background: linear-gradient(135deg, rgba(40, 10, 80, 0.8), rgba(20, 5, 40, 0.9));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .setting-label { font-size: 8px; color: #ffaa00; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .setting-select {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-size: 11px;
            font-weight: 900;
            outline: none;
            cursor: pointer;
            text-align: center;
            width: 100%;
            margin-top: 2px;
        }
        .setting-select option { background: #120124; color: #fff; }

        .chips-scroll-container {
            width: 100%;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .chips-scroll-container::-webkit-scrollbar { display: none; }

        .chip-pill {
            min-width: 38px;
            height: 30px;
            background: linear-gradient(135deg, #2d0b52, #140226);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .chip-pill.active-chip {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
            transform: scale(1.1);
        }

        .action-panel {
            width: 100%;
            background: linear-gradient(135deg, #220538, #10011c);
            border-radius: 12px;
            border: 1px solid rgba(255, 31, 64, 0.5);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .drop-btn {
            background: linear-gradient(135deg, #ff1f40, #ff007f);
            border: none;
            border-radius: 10px;
            color: #fff;
            padding: 10px 28px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 31, 64, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .drop-btn:active { transform: scale(0.95); }

        .bet-info { font-size: 9px; text-align: right; }
        .bet-val { font-size: 15px; color: #ffd700; font-weight: 900; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <a href="index.html" class="back-btn">← Back</a>
            <div class="title">🔮 PLINKO 1000</div>
            <div class="balance-box">₹<span id="balance">0.00</span></div>
        </div>

        <canvas id="plinkoCanvas" width="370" height="260"></canvas>
        <div class="status-banner" id="statusBanner">SELECT CHIP & DROP BALLS!</div>

        <div class="settings-bar">
            <div class="setting-box">
                <span class="setting-label">Risk Level</span>
                <select class="setting-select" id="riskSelect" onchange="drawStaticElements()">
                    <option value="low">Low Risk</option>
                    <option value="med">Medium Risk</option>
                    <option value="high" selected>High Risk (1000X)</option>
                </select>
            </div>
            <div class="setting-box">
                <span class="setting-label">Balls Amount</span>
                <select class="setting-select" id="ballsSelect" onchange="updateUI()">
                    <option value="1">1 Ball</option>
                    <option value="2">2 Balls</option>
                    <option value="5">5 Balls</option>
                    <option value="10">10 Balls</option>
                    <option value="20">20 Balls</option>
                </select>
            </div>
        </div>

        <div class="chips-scroll-container">
            <div class="chip-pill active-chip" onclick="setChip(10, this)">10</div>
            <div class="chip-pill" onclick="setChip(20, this)">20</div>
            <div class="chip-pill" onclick="setChip(50, this)">50</div>
            <div class="chip-pill" onclick="setChip(100, this)">100</div>
            <div class="chip-pill" onclick="setChip(200, this)">200</div>
            <div class="chip-pill" onclick="setChip(500, this)">500</div>
            <div class="chip-pill" onclick="setChip(1000, this)">1000</div>
            <div class="chip-pill" onclick="setChip(2000, this)">2000</div>
        </div>

        <div class="action-panel">
            <button class="drop-btn" id="dropBtn" onclick="startPlinkoGame()">DROP BALL</button>
            <div class="bet-info">
                <span style="color:#aaa; font-weight:700;">TOTAL BET</span><br>
                <span class="bet-val" id="betDisplay">₹10</span>
            </div>
        </div>
    </div>

    <script>
        // Wallet balance set to 0.00 initially
        let balance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
        let currentBet = 10;
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');

        const lowMults  = [15, 6, 2, 1.2, 1.1, 0.5, 1.1, 1.2, 2, 6, 15];
        const medMults  = [200, 50, 20, 5, 2, 0.2, 2, 5, 20, 50, 200];
        const highMults = [1000, 135, 20, 10, 2, 0.2, 2, 10, 20, 135, 1000];

        const rows = 8;
        const pinRadius = 2.2;
        let activeBalls = [];
        let animationFrameId = null;

        updateUI();
        drawStaticElements();

        function updateUI() {
            let ballsCount = parseInt(document.getElementById('ballsSelect').value) || 1;
            let totalBetAmount = currentBet * ballsCount;

            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('betDisplay').innerText = '₹' + totalBetAmount;
            localStorage.setItem('user_balance', balance.toFixed(2));
        }

        function setChip(amount, element) {
            document.querySelectorAll('.chip-pill').forEach(c => c.classList.remove('active-chip'));
            element.classList.add('active-chip');
            currentBet = amount;
            updateUI();
        }

        function getPins() {
            let pins = [];
            for (let r = 0; r < rows; r++) {
                const count = r + 3;
                const spacing = 26;
                const startX = (canvas.width - (count - 1) * spacing) / 2;
                for (let c = 0; c < count; c++) {
                    pins.push({
                        x: startX + c * spacing,
                        y: 22 + r * 20
                    });
                }
            }
            return pins;
        }

        function drawStaticElements() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ffcc';
            const pins = getPins();
            pins.forEach(pin => {
                ctx.beginPath();
                ctx.arc(pin.x, pin.y, pinRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            let risk = document.getElementById('riskSelect').value;
            let multsArray = risk === 'low' ? lowMults : (risk === 'med' ? medMults : highMults);
            let barColor = risk === 'low' ? '#0088cc' : (risk === 'med' ? '#00cc66' : '#ff1f40');
            
            drawActiveSlotRow(multsArray, barColor, canvas.height - 25);
        }

        function drawActiveSlotRow(multsArray, color, slotY) {
            const slots = multsArray.length;
            const slotWidth = 30;
            const startSlotX = (canvas.width - slots * slotWidth) / 2;

            for (let i = 0; i < slots; i++) {
                ctx.fillStyle = color;
                ctx.fillRect(startSlotX + i * slotWidth + 1, slotY, slotWidth - 2, 20);
                
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(startSlotX + i * slotWidth + 1, slotY, slotWidth - 2, 20);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 9px Segoe UI';
                ctx.textAlign = 'center';
                let label = multsArray[i] >= 1000 ? '1k' : multsArray[i] + 'x';
                ctx.fillText(label, startSlotX + i * slotWidth + slotWidth / 2, slotY + 13);
            }
        }

        function startPlinkoGame() {
            let ballsCount = parseInt(document.getElementById('ballsSelect').value);
            let totalCost = currentBet * ballsCount;

            if (balance <= 0 || balance < totalCost) {
                document.getElementById('statusBanner').innerText = "INSUFFICIENT BALANCE!";
                return;
            }

            balance -= totalCost;
            updateUI();
            document.getElementById('statusBanner').innerText = `DROPPING ${ballsCount} BALL(S)...`;

            let risk = document.getElementById('riskSelect').value;
            let multsArray = risk === 'low' ? lowMults : (risk === 'med' ? medMults : highMults);

            for (let b = 0; b < ballsCount; b++) {
                setTimeout(() => {
                    const luck = Math.random() * 100;
                    let targetIndex = Math.floor(Math.random() * multsArray.length);
                    if (luck >= 70) {
                        const winOptions = [0, 1, 9, 10];
                        targetIndex = winOptions[Math.floor(Math.random() * winOptions.length)];
                    }

                    activeBalls.push({
                        x: canvas.width / 2 + (Math.random() * 10 - 5),
                        y: 0,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: 1 + Math.random() * 1,
                        targetSlot: targetIndex,
                        mult: multsArray[targetIndex]
                    });

                    if (!animationFrameId) {
                        animateGame();
                    }
                }, b * 150);
            }
        }

        function animateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ffcc';
            const pins = getPins();
            pins.forEach(pin => {
                ctx.beginPath();
                ctx.arc(pin.x, pin.y, pinRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            let risk = document.getElementById('riskSelect').value;
            let multsArray = risk === 'low' ? lowMults : (risk === 'med' ? medMults : highMults);
            let barColor = risk === 'low' ? '#0088cc' : (risk === 'med' ? '#00cc66' : '#ff1f40');
            drawActiveSlotRow(multsArray, barColor, canvas.height - 25);

            let totalWinRound = 0;

            for (let i = activeBalls.length - 1; i >= 0; i--) {
                let ball = activeBalls[i];
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.2;

                pins.forEach(pin => {
                    let dx = ball.x - pin.x;
                    let dy = ball.y - pin.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < pinRadius + 4) {
                        ball.vy *= -0.4;
                        ball.vx += (Math.random() - 0.5) * 2;
                    }
                });

                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 4.5, 0, Math.PI * 2);
                ctx.fill();

                if (ball.y >= canvas.height - 30) {
                    totalWinRound += currentBet * ball.mult;
                    activeBalls.splice(i, 1);
                }
            }

            if (activeBalls.length > 0) {
                animationFrameId = requestAnimationFrame(animateGame);
            } else {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                if (totalWinRound > 0) {
                    balance += totalWinRound;
                    updateUI();
                    document.getElementById('statusBanner').innerText = `TOTAL WIN: ₹${totalWinRound.toFixed(2)}`;
                }
            }
        }
    </script>
</body>
</html>
