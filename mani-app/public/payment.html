<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - DREAM 66</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #141b2d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00ffcc;
        }
        .qr-box {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .qr-box img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .info-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #a0aec0;
            display: block;
            margin-bottom: 5px;
        }
        .input-with-btn {
            display: flex;
            background: #1a2238;
            border: 1px solid #2d3748;
            border-radius: 6px;
            overflow: hidden;
        }
        .input-with-btn input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px;
            width: 100%;
            font-size: 14px;
            outline: none;
        }
        .copy-btn {
            background: #2d3748;
            border: none;
            color: #00ffcc;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .copy-btn:active {
            background: #4a5568;
        }
        .utr-input {
            width: 100%;
            background: #1a2238;
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            margin-top: 5px;
        }
        .confirm-btn {
            background: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .confirm-btn:hover {
            background: #218838;
        }
        .timer {
            color: #ffc107;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Scan QR code using UPI app</h2>
        
        <!-- QR Code Image (உங்களது க்யூ ஆர் கோடு லிங்க் அல்லது இமேஜ் இங்கே இருக்கும்) -->
        <div class="qr-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=6379227658-2@ybl&pn=DREAM66&am=300" alt="QR Code">
        </div>

        <!-- UPI ID to pay manually -->
        <div class="info-group">
            <label>UPI ID to pay manually</label>
            <div class="input-with-btn">
                <input type="text" id="upiId" value="6379227658-2@ybl" readonly>
                <button class="copy-btn" onclick="copyText('upiId')">Copy</button>
            </div>
        </div>

        <!-- Amount -->
        <div class="info-group">
            <label>Amount</label>
            <div class="input-with-btn">
                <input type="text" id="amountVal" value="300 INR" readonly>
                <button class="copy-btn" onclick="copyText('amountVal')">Copy</button>
            </div>
        </div>

        <!-- UTR Number Input -->
        <div class="info-group" style="margin-top: 20px;">
            <label style="color: #00ffcc; font-weight: bold;">Enter 12-Digit UTR Number (Mandatory):</label>
            <input type="text" class="utr-input" id="utrNumber" placeholder="Enter 12-digit UTR reference no..." maxlength="12">
        </div>

        <!-- Confirm Payment Button -->
        <button class="confirm-btn" onclick="submitPayment()">Confirm Payment (<span id="countdown">08:45</span>)</button>
    </div>

    <script>
        // காப்பி செய்யும் வசதிக்கான ஜாவாஸ்கிரிப்ட்
        function copyText(elementId) {
            var copyText = document.getElementById(elementId);
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Copied: " + copyText.value);
        }

        // பேமெண்ட் உறுதி செய்யும் போது சரிபார்த்தல்
        function submitPayment() {
            var utr = document.getElementById('utrNumber').value.trim();
            if(utr.length < 12) {
                alert("தயவுசெய்து சரியான 12 இலக்க UTR எண்ணை உள்ளிடவும்!");
                return;
            }
            alert("Payment submitted successfully! Your balance will be updated soon.");
            // இங்கே நீங்கள் பேமெண்ட் வெற்றிகரமாக ஆனதற்கான அடுத்தக்கட்ட கோடுகளை இணைக்கலாம்
        }

        // டைமர் (Timer) இயங்குவதற்கு
        let time = 525; // 8 minutes 45 seconds
        setInterval(() => {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            document.getElementById('countdown').innerText = 
                (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            if(time > 0) time--;
        }, 1000);
    </script>
</body>
</html>
