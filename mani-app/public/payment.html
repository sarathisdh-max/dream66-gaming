<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Zoom Disable & Screen Lock Applied -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Payment Gateway</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; touch-action: manipulation; }
        body { background-color: #f2f4f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; user-select: none; }
        .gateway-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e5e7eb; padding: 16px; }
        
        .top-close-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { font-size: 20px; cursor: pointer; color: #333; font-weight: bold; }
        .menu-badge { background: #f3f4f6; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .scan-title { text-align: center; font-size: 16px; font-weight: 700; color: #111; margin-bottom: 8px; }
        .upi-icons { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        
        .pay-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .pay-instruction { font-size: 12px; color: #6b7280; line-height: 1.4; margin-bottom: 6px; }
        .download-qr { font-size: 12px; color: #16a34a; font-weight: 600; text-decoration: none; display: inline-block; margin-bottom: 10px; cursor: pointer; }
        
        .qr-box { text-align: center; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px auto; min-height: 160px; }

        .field-label { font-size: 11px; color: #6b7280; margin-bottom: 3px; }
        .field-value-box { display: flex; justify-content: space-between; align-items: center; background: #ffffff; border: 1px solid #d1d5db; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #111; margin-bottom: 10px; }
        .copy-icon { cursor: pointer; color: #16a34a; font-size: 14px; }

        .tutorial-link { display: flex; align-items: center; gap: 8px; color: #2563eb; font-size: 12px; font-weight: 600; text-decoration: none; margin-bottom: 15px; background: #eff6ff; padding: 10px; border-radius: 8px; }

        .pay-with-app-btn { background: #111; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 30px; font-weight: bold; font-size: 14px; text-decoration: none; margin-bottom: 12px; cursor: pointer; width: 100%; border: none; }
        
        .confirm-pay-btn { width: 100%; background: #16a34a; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; }
        .confirm-pay-btn:hover { background: #15803d; }

        .utr-input-box { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; margin-bottom: 10px; background: #fff; }
    </style>
</head>
<body>

<div class="gateway-container">
    <div class="top-close-bar">
        <div class="close-btn" onclick="goBackToHome()">✕</div>
        <div class="menu-badge" onclick="goBackToHome()">🌐 Menu</div>
    </div>

    <div class="scan-title">Scan QR code using UPI app</div>
    <div class="upi-icons">
        <span style="color: #5f259f;">PhonePe</span> | 
        <span style="color: #00baf2;">UPI</span> | 
        <span style="color: #4285f4;">G Pay</span> | 
        <span style="color: #002e6e;">Paytm</span>
    </div>

    <div class="pay-card" style="text-align: center;">
        <div style="text-align: left;">
            <div class="pay-instruction">Pay to these details only once</div>
            <a class="download-qr" onclick="alert('QR code ready to scan!')">⬇ Download QR</a>
        </div>

        <!-- QR Code Dynamic Box -->
        <div class="qr-box" id="qrcodeContainer"></div>
    </div>

    <!-- UPI ID Manual Copy -->
    <div class="field-label">UPI ID to pay manually</div>
    <div class="field-value-box">
        <span id="upiIdText">6379227658-2@ybl</span>
        <span class="copy-icon" onclick="copyText('upiIdText')">📋</span>
    </div>

    <!-- Amount Display -->
    <div class="field-label">Amount</div>
    <div class="field-value-box">
        <span id="displayAmountVal" style="color: #1e3a8a; font-size: 15px;">1000 INR</span>
        <span class="copy-icon" onclick="copyText('displayAmountVal')">📋</span>
    </div>

    <!-- Watch how to deposit -->
    <a href="#" class="tutorial-link" onclick="alert('Redirecting to video tutorial...')">
        ▶ Watch how to deposit
    </a>

    <!-- Pay with App Bar (Fixed with Android Intent to prevent UNKNOWN_URL_SCHEME error) -->
    <button onclick="openUpiApp()" class="pay-with-app-btn">
        <div style="display: flex; gap: 8px; font-size: 12px;">
            <span>💳</span><span>⚡</span><span>📲</span>
        </div>
        <span>Pay with app</span>
        <span>➔</span>
    </button>

    <!-- Mandatory UTR Input & Confirm Button -->
    <div style="margin-top: 10px;">
        <div class="field-label">Enter 12-Digit UTR Number (Mandatory):</div>
        <input type="text" id="utrInput" class="utr-input-box" placeholder="Enter 12-digit UTR reference no...">
        
        <button class="confirm-pay-btn" onclick="submitPaymentToWhatsApp()">
            Confirm Payment (<span id="paymentTimer">10:00</span>)
        </button>
    </div>
</div>

<script>
    // URL-ல் இருந்து அமௌன்ட்டை எடுப்பது
    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('amount') || '1000';
    
    const amtEl = document.getElementById('displayAmountVal');
    if(amtEl) {
        amtEl.innerText = amount + " INR";
    }

    let upiId = "6379227658-2@ybl";
    let payeeName = "Mr Sarathi S";

    // Dynamic QR Code Generation
    let upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;
    
    document.getElementById("qrcodeContainer").innerHTML = ""; 
    new QRCode(document.getElementById("qrcodeContainer"), {
        text: upiString,
        width: 140,
        height: 140,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // Copy to Clipboard Function
    function copyText(elementId) {
        let text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text);
        alert("Copied: " + text);
    }

    // 10 Minutes Countdown Timer (Fixed)
    let duration = 10 * 60;
    let timerInterval = setInterval(function () {
        let minutes = parseInt(duration / 60, 10);
        let seconds = parseInt(duration % 60, 10);

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById('paymentTimer').textContent = minutes + ":" + seconds;

        if (--duration < 0) {
            clearInterval(timerInterval);
            document.getElementById('paymentTimer').textContent = "Expired";
        }
    }, 1000);

    // Open UPI App safely using Android Intent (Fixes net::ERR_UNKNOWN_URL_SCHEME error)
    function openUpiApp() {
        let rawUpi = `pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;
        // Android Intent ஸ்கீம் மூலம் PhonePe / GPay / Paytm ஆப்ஸை நேரடியாகத் திறக்கும்
        let intentUrl = `intent://pay?${rawUpi}#Intent;scheme=upi;package=com.phonepe.app;end`;
        window.location.href = intentUrl;
    }

    // Back to Home safely (Prevents localhost errors)
    function goBackToHome() {
        if(document.referrer && !document.referrer.includes('localhost')) {
            window.history.back();
        } else {
            window.location.href = 'index.html';
        }
    }

    // Submit UTR to WhatsApp
    function submitPaymentToWhatsApp() {
        let utr = document.getElementById('utrInput').value.trim();
        if(!utr || utr.length < 10) {
            alert("Please enter a valid 12-digit UTR number to confirm payment!");
            return;
        }

        let adminWhatsApp = "916379227658";
        let message = `*New Deposit Request*%0A*Amount:* ₹${amount}%0A*UTR Number:* ${utr}%0A*Status:* Pending Verification`;
        window.open(`https://wa.me/${adminWhatsApp}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
