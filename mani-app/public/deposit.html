<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM 66 - Pro Casino Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #050102; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 410px; background: #0f0205; border-radius: 16px; border: 2px solid #2b060c; overflow: hidden; position: relative; min-height: 750px; box-shadow: 0 15px 40px rgba(255, 42, 75, 0.3); }
        .screen { display: none; padding: 12px; padding-bottom: 80px; max-height: 680px; overflow-y: auto; }
        .screen.active { display: block !important; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: linear-gradient(180deg, #180306, #0f0205); border-bottom: 1px solid #26050b; }
        .brand-title { color: #ff1f40; font-weight: 900; font-size: 22px; font-style: italic; text-shadow: 0 0 10px rgba(255,31,64,0.5); }
        .live-ticker { background: #170306; border-bottom: 1px solid #2d070d; padding: 7px 12px; font-size: 12px; color: #ffd700; overflow: hidden; display: flex; align-items: center; height: 35px; white-space: nowrap; }
        .ticker-container { display: inline-block; white-space: nowrap; animation: smoothScroll 60s linear infinite; }
        .ticker-item { display: inline-block; margin-right: 50px; font-weight: 600; }
        @keyframes smoothScroll { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        
        .categories { display: flex; gap: 18px; padding: 12px 16px; background: #120205; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #220409; }
        .cat-item { color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; opacity: 0.8; }
        .cat-item.active { color: #ffb700; border-bottom: 2px solid #ffb700; opacity: 1; }
        
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
        .game-card { background: #1f040a; border: 1px solid #3d0a14; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; text-align: center; transition: all 0.3s ease; }
        .game-card:hover, .game-card:active { border-color: #ffd700; background: linear-gradient(135deg, #2a1f02, #1f040a); box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); transform: scale(0.95); }
        .game-tag { position: absolute; top: 5px; left: 5px; background: #ff1f40; color: #fff; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 3px; }
        .game-img { width: 100%; height: 85px; background: #170205; display: flex; justify-content: center; align-items: center; font-size: 28px; }
        .game-info { padding: 8px 4px; background: rgba(15, 2, 5, 0.9); }
        .game-name { font-size: 10px; font-weight: 800; color: #ffffff; }
        
        .card { background: #1a0408; border: 1px solid #360912; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .red-btn { width: 100%; background: linear-gradient(135deg, #ff1f40, #a8001b); color: white; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .utr-input { width: 100%; padding: 9px; background: #0f0205; border: 1px solid #4a0d17; color: #ffd700; border-radius: 6px; outline: none; font-size: 13px; margin-top: 5px; }
        
        .wallet-tabs { display: flex; background: #180306; border-radius: 10px; padding: 4px; margin-bottom: 12px; border: 1px solid #2b060c; }
        .w-tab { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: bold; color: #7a686e; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .w-tab.active { background: #ffb700; color: #000; }
        
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
        .amt-chip { background: #1f040a; border: 1px solid #4a0d17; padding: 8px; text-align: center; border-radius: 6px; font-size: 12px; font-weight: bold; color: #ffd700; cursor: pointer; }
        .amt-chip:hover, .amt-chip.active { background: #ff1f40; color: #fff; border-color: #ff1f40; }

        .policy-link-item { background: #1f040a; border: 1px solid #3d0a14; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; font-weight: bold; color: #ffd700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: #120205; display: flex; justify-content: space-around; padding: 6px 0; border-top: 1px solid #26050b; z-index: 10; }
        .nav-item { color: #7a686e; text-align: center; font-size: 9px; cursor: pointer; border: none; background: none; font-weight: 600; flex: 1; }
        .nav-item.active { color: #ffb700; }
        .nav-item span { font-size: 16px; display: block; }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="top-bar">
        <div class="brand-title">DREAM 66</div>
    </div>
    
    <div id="casinoScreen" class="screen active">
        <div class="live-ticker" style="margin-bottom: 12px; border-radius: 6px;">
            <div style="overflow: hidden; width: 100%;">
                <div class="ticker-container" id="tickerContainer"></div>
            </div>
        </div>
        <div class="categories">
            <div class="cat-item active" onclick="filterGames('All', this)">All Games</div>
            <div class="cat-item" onclick="filterGames('Hot', this)">Hot</div>
            <div class="cat-item" onclick="filterGames('JDB', this)">JDB</div>
            <div class="cat-item" onclick="filterGames('Slots', this)">Slots</div>
            <div class="cat-item" onclick="filterGames('Live', this)">Live</div>
        </div>
        <div class="games-grid" id="gamesGridContainer"></div>
    </div>

    <div id="walletScreen" class="screen">
        <div class="wallet-tabs">
            <div class="w-tab active" id="tabDepositBtn" onclick="switchWalletTab('deposit')">Deposit</div>
            <div class="w-tab" id="tabWithdrawBtn" onclick="switchWalletTab('withdraw')">Withdraw</div>
        </div>

        <div id="depositSectionWallet">
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <div style="flex: 1; background: linear-gradient(135deg, #f3d063, #c9941b); padding: 10px; border-radius: 8px; color: #000; text-align: center;">
                    <p style="font-size: 10px; font-weight: 700;">Cash Balance</p>
                    <h3 style="font-size: 15px; font-weight: 900;">₹0</h3>
                </div>
                <div style="flex: 1; background: linear-gradient(135deg, #f7dc79, #d4a017); padding: 10px; border-radius: 8px; color: #000; text-align: center;">
                    <p style="font-size: 10px; font-weight: 700;">Withdrawable</p>
                    <h3 style="font-size: 15px; font-weight: 900;">₹0</h3>
                </div>
            </div>
            
            <div class="card" style="text-align: center;">
                <p style="font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #ffd700;">1. Select Deposit Amount</p>
                <div class="amount-grid" id="depAmountGrid">
                    <div class="amt-chip active" onclick="setDepositAmount(100, this)">₹100</div>
                    <div class="amt-chip" onclick="setDepositAmount(500, this)">₹500</div>
                    <div class="amt-chip" onclick="setDepositAmount(1000, this)">₹1000</div>
                    <div class="amt-chip" onclick="setDepositAmount(2000, this)">₹2000</div>
                    <div class="amt-chip" onclick="setDepositAmount(3000, this)">₹3000</div>
                    <div class="amt-chip" onclick="setDepositAmount(5000, this)">₹5000</div>
                </div>
                <input type="text" id="selectedAmountBox" class="utr-input" placeholder="Amount Selected" readonly style="text-align:center; font-weight:bold; margin-bottom:12px;">
                
                <div style="background: #180306; border: 1px dashed #ffd700; padding: 12px; border-radius: 8px; margin-bottom: 12px;">
                    <p style="font-size: 12px; font-weight: bold; color: #ffd700; margin-bottom: 6px;">2. Scan QR & Pay</p>
                    <div style="background: #fff; padding: 8px; display: inline-block; border-radius: 6px; margin-bottom: 6px;">
                        <img src="1000060705.png" alt="PhonePe QR" style="width: 130px; height: 130px; display: block;">
                    </div>
                    <p style="font-size: 11px; color: #ccc; margin-bottom: 4px;">(OR) Pay to UPI ID:</p>
                    <div style="background: #0f0205; padding: 6px; border-radius: 6px; border: 1px solid #4a0d17; font-size: 12px; font-weight: bold; color: #ffd700; user-select: all;">
                        9092788868-v8a4@axl
                    </div>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 11px; font-weight: bold; color: #ffd700;">3. Enter 12-digit UTR / Ref Number:</label>
                    <input type="text" id="utrNumberInput" class="utr-input" placeholder="Enter 12-digit UTR number here">
                    <button class="red-btn" onclick="alert('UTR Submitted Successfully!')">Submit UTR & Verify</button>
                </div>
            </div>
        </div>

        <div id="withdrawSectionWallet" style="display: none;">
            <div style="background: #1a0408; border: 1px solid #360912; border-radius: 12px; padding: 12px;">
                <p style="font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #ffd700; text-align: center;">Withdrawal Request</p>
                <input type="text" id="bankHolderName" class="utr-input" placeholder="Bank Holder Name" style="margin-bottom:8px;">
                <input type="text" id="accNumber" class="utr-input" placeholder="Account Number" style="margin-bottom:8px;">
                <input type="text" id="ifscCode" class="utr-input" placeholder="IFSC Code" style="margin-bottom:8px;">
                <button class="red-btn" onclick="alert('Withdrawal Submitted!')">Submit Withdrawal</button>
            </div>
        </div>
    </div>

    <div id="supportScreen" class="screen">
        <div class="card" style="text-align: center; padding: 15px;">
            <h2 style="color: #ff1f40; font-size: 15px; font-weight: 900; margin-bottom: 8px;">24/7 SUPPORT</h2>
            <button class="red-btn" onclick="openWhatsAppSupport()" style="background: linear-gradient(135deg, #25D366, #128C7E);">💬 WhatsApp Support</button>
        </div>
    </div>

    <div id="menuScreen" class="screen">
        <div class="card" style="text-align: center;">
            <h4 style="font-size: 14px; color: #ffd700;">Account Menu</h4>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="navigateTo('casinoScreen'); setActiveNav(this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="navigateTo('walletScreen'); setActiveNav(this)"><span>💳</span>Wallet</button>
        <button class="nav-item" onclick="navigateTo('supportScreen'); setActiveNav(this)"><span>💬</span>Support</button>
        <button class="nav-item" onclick="navigateTo('menuScreen'); setActiveNav(this)"><span>≡</span>Menu</button>
    </div>
</div>
<script>
    let selectedDepAmt = 100;

    const gamesForTicker = ["JetX", "Aviator", "Arrow", "Coin Tree", "Crazy Time", "Dice", "Diver", "Double", "Goblin", "Hilo", "Plinko", "Roma", "Roulette", "Teen Patti"];
    let tickerHtml = "";
    for (let i = 1; i <= 15; i++) {
        let randomUserNum = Math.floor(10 + Math.random() * 89);
        let randomAmount = Math.floor(1000 + Math.random() * 20000);
        let randomGame = gamesForTicker[Math.floor(Math.random() * gamesForTicker.length)];
        tickerHtml += `<span class="ticker-item">User***${randomUserNum} won ₹${randomAmount} on ${randomGame}</span> | `;
    }
    document.getElementById('tickerContainer').innerHTML = tickerHtml + tickerHtml;

    const allGamesData = [
        { id: 1, name: "JetX", cat: "Hot", tag: "HOT", icon: "🚀", link: "jetx.html" },
        { id: 2, name: "Aviator", cat: "Hot", tag: "HOT", icon: "✈", link: "aviator.html" },
        { id: 3, name: "Arrow", cat: "Hot", tag: "HOT", icon: "🎯", link: "arrow.html" },
        { id: 4, name: "Coin Tree", cat: "JDB", tag: "JDB", icon: "🌳", link: "cointree.html" },
        { id: 5, name: "Crazy Time", cat: "Live", tag: "LIVE", icon: "🎡", link: "crazytime.html" },
        { id: 6, name: "Dice", cat: "Hot", tag: "HOT", icon: "🎲", link: "dice.html" },
        { id: 7, name: "Diver", cat: "Hot", tag: "HOT", icon: "🤿", link: "diver.html" },
        { id: 8, name: "Double", cat: "Slots", tag: "SLOTS", icon: "✖2", link: "double.html" },
        { id: 9, name: "Goblin", cat: "JDB", tag: "JDB", icon: "👺", link: "goblin.html" },
        { id: 10, name: "Hilo", cat: "Slots", tag: "SLOTS", icon: "📊", link: "hilo.html" },
        { id: 11, name: "Plinko", cat: "JDB", tag: "JDB", icon: "🔴", link: "plinko.html" },
        { id: 12, name: "Roma", cat: "Slots", tag: "SLOTS", icon: "🛡️", link: "roma.html" },
        { id: 13, name: "Roulette", cat: "Live", tag: "LIVE", icon: "🎰", link: "roulette.html" },
        { id: 14, name: "Teen Patti", cat: "Hot", tag: "HOT", icon: "🃏", link: "teenpatti.html" }
    ];

    function renderGames(games) {
        let gridHtml = "";
        games.forEach(g => {
            gridHtml += `
                <div class="game-card" onclick="window.location.href='${g.link}'">
                    <div class="game-tag">${g.tag}</div>
                    <div class="game-img">${g.icon}</div>
                    <div class="game-info">
                        <div class="game-name">${g.name}</div>
                    </div>
                </div>
            `;
        });
        document.getElementById('gamesGridContainer').innerHTML = gridHtml;
    }

    renderGames(allGamesData);

    function filterGames(category, element) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        if(category === 'All') {
            renderGames(allGamesData);
        } else {
            let filtered = allGamesData.filter(g => g.cat === category);
            renderGames(filtered);
        }
    }

    function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function setActiveNav(btn) {
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
    }

    function switchWalletTab(tab) {
        if(tab === 'deposit') {
            document.getElementById('tabDepositBtn').classList.add('active');
            document.getElementById('tabWithdrawBtn').classList.remove('active');
            document.getElementById('depositSectionWallet').style.display = 'block';
            document.getElementById('withdrawSectionWallet').style.display = 'none';
        } else {
            document.getElementById('tabWithdrawBtn').classList.add('active');
            document.getElementById('tabDepositBtn').classList.remove('active');
            document.getElementById('withdrawSectionWallet').style.display = 'block';
            document.getElementById('depositSectionWallet').style.display = 'none';
        }
    }

    function setDepositAmount(amt, element) {
        selectedDepAmt = amt;
        document.querySelectorAll('#depAmountGrid .amt-chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('selectedAmountBox').value = "₹" + amt + " Selected";
    }

    function openWhatsAppSupport() {
        let phoneNumber = "916379227658";
        let message = "Hello DREAM 66 Support, I need help with UTR verification.";
        let url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
    
    setDepositAmount(100, document.querySelector('#depAmountGrid .amt-chip'));
</script>
</body>
</html>
