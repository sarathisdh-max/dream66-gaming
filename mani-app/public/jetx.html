<!-- Back Button -->
<button onclick="goBackHome()" style="position: absolute; top: 10px; left: 10px; background: linear-gradient(135deg, #ff4d4d, #cc0000); color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; z-index: 9999; box-shadow: 0 2px 5px rgba(0,0,0,0.4);">
    ← Back
</button>

<script>
    function goBackHome() {
        playClickSound();
        window.location.href = 'http://localhost:5000';
    }

    function playClickSound() {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.08);
        } catch(e) {
            console.log("Audio not supported");
        }
    }

    document.addEventListener('click', function(e) {
        if(e.target.tagName === 'BUTTON') {
            playClickSound();
        }
    });
</script>

        <canvas id="gameCanvas" width="400" height="160"></canvas>

    <!-- Panel 1 -->
    <div class="control-panel">
        <div class="tab-buttons">

    <!-- Panel 2 -->
    <div class="control-panel">
        <div class="tab-buttons">
            <button class="tab-btn active" id="p2BetTab" onclick="switchPanelTab(2, 'bet')">Bet</button>
            <button class="tab-btn" id="p2AutoTab" onclick="switchPanelTab(2, 'auto')">Auto</button>
        </div>
        <div class="bet-row">
            <div class="bet-input-box">
                <div class="input-controls">
                    <button class="qty-btn" onclick="changeAmt(2, -50)">-</button>
                    <input type="number" id="betAmount2" value="10.00" onchange="validateMin(2)">
                    <button class="qty-btn" onclick="changeAmt(2, 50)">+</button>
                </div>
                <div class="quick-amounts">
                    <button class="quick-btn" onclick="setAmt(2, 50)">50</button>
                    <button class="quick-btn" onclick="setAmt(2, 100)">100</button>
                    <button class="quick-btn" onclick="setAmt(2, 300)">300</button>
                    <button class="quick-btn" onclick="setAmt(2, 500)">500</button>
                    <button class="quick-btn" onclick="setAmt(2, 1000)">1000</button>
                    <button class="quick-btn" onclick="setAmt(2, 2000)">2000</button>
                </div>
                <div class="autoSection" id="p2AutoSec">
                    <span>Auto Payout</span>
                    <div class="auto-controls-wrap">
                        <button class="auto-qty-btn" onclick="changeAutoVal(2, -0.5)">-</button>
                        <div class="auto-input-wrapper">
                            <input type="number" id="autoVal2" value="2.00" step="0.1" onchange="validateAutoMin(2)">
                            <span class="auto-suffix">x</span>
                        </div>
                        <button class="auto-qty-btn" onclick="changeAutoVal(2, 0.5)">+</button>
                    </div>
                </div>
            </div>
            <button class="actionButton" id="actionBtn2" onclick="handleAction(2)">Bet<br>10.00 INR</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const historyBar = document.getElementById('historyBar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        let userBalance = 0.00;
        let panelState = {
            1: { bet: 10, isAuto: false, isPlaying: false, hasWon: false },
            2: { bet: 10, isAuto: false, isPlaying: false, hasWon: false }
        };

        let currentMultiplierVal = 1.00;
        let previousRounds = JSON.parse(localStorage.getItem('dream66_jetx_history')) || [1.80, 1.30, 2.50, 1.05];
        
        // --- Galaxy Stars Animation Data ---
        let stars = [];
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                alpha: Math.random()
            });
        }

        // Particle Trail (நெருப்பு / புகைப் பாதை)
        let particles = [];

        updateHistoryUI();
        let countdownInterval = null;

        function updateBalanceUI() {
            balanceDisplay.textContent = 'Wallet: ₹ ' + userBalance.toLocaleString('en-IN', {minimumFractionDigits: 2});
        }

        function switchPanelTab(pId, tab) {
            if (pId === 1) {
                panelState[1].isAuto = (tab === 'auto');
                document.getElementById('p1BetTab').classList.toggle('active', tab === 'bet');
                document.getElementById('p1AutoTab').classList.toggle('active', tab === 'auto');
                document.getElementById('p1AutoSec').style.display = (tab === 'auto') ? 'flex' : 'none';
            } else {
                panelState[2].isAuto = (tab === 'auto');
                document.getElementById('p2BetTab').classList.toggle('active', tab === 'bet');
                document.getElementById('p2AutoTab').classList.toggle('active', tab === 'auto');
                document.getElementById('p2AutoSec').style.display = (tab === 'auto') ? 'flex' : 'none';
            }
        }

        function setAmt(pId, val) {
            document.getElementById('betAmount' + pId).value = val.toFixed(2);
            panelState[pId].bet = val;
            updateButtonText(pId);
        }

        function changeAmt(pId, stepVal) {
            let input = document.getElementById('betAmount' + pId);
            let curr = parseFloat(input.value) || 10;
            let newVal = Math.max(10, curr + stepVal);
            input.value = newVal.toFixed(2);
            panelState[pId].bet = newVal;
            updateButtonText(pId);
        }

        function validateMin(pId) {
            let input = document.getElementById('betAmount' + pId);
            let val = parseFloat(input.value) || 10;
            if(val < 10) val = 10;
            input.value = val.toFixed(2);
            panelState[pId].bet = val;
            updateButtonText(pId);
        }

        function changeAutoVal(pId, step) {
            let input = document.getElementById('autoVal' + pId);
            let curr = parseFloat(input.value) || 2.0;
            let newVal = Math.max(1.1, curr + step);
            input.value = newVal.toFixed(1);
        }

        function validateAutoMin(pId) {
            let input = document.getElementById('autoVal' + pId);
            let val = parseFloat(input.value) || 2.0;
            if(val < 1.1) val = 1.1;
            input.value = val.toFixed(1);
        }

        function updateButtonText(pId) {
            let btn = document.getElementById('actionBtn' + pId);
            let val = parseFloat(document.getElementById('betAmount' + pId).value) || 10;
            if (!panelState[pId].isPlaying) {
                btn.innerHTML = 'Bet<br>' + val.toFixed(2) + ' INR';
                btn.style.backgroundColor = '#2ed573';
                btn.classList.remove('cashout');
                panelState[pId].hasWon = false;
            }
        }

        function handleAction(pId) {
            let state = panelState[pId];
            let btn = document.getElementById('actionBtn' + pId);
            let inputVal = parseFloat(document.getElementById('betAmount' + pId).value) || 10;
            if (inputVal < 10) inputVal = 10;
            state.bet = inputVal;

            if (!state.isPlaying) {
                if (userBalance < state.bet) {
                    alert('Insufficient Balance!');
                    return;
                }
                userBalance -= state.bet;
                updateBalanceUI();
                socket.emit('placeJetxBet', { pId: pId, amount: state.bet });
                
                state.isPlaying = true;
                state.hasWon = false;
                let currentWin = (state.bet * currentMultiplierVal).toFixed(2);
                btn.innerHTML = 'Cashout<br>₹' + currentWin + ' (' + currentMultiplierVal.toFixed(2) + 'x)';
                btn.classList.add('cashout');
            } else {
                // லாபப் பங்கீடு: 60% கம்பெனி, 40% யூசர்
                let rawWinAmt = (state.bet * currentMultiplierVal);
                let profit = rawWinAmt - state.bet;
                let userProfitShare = profit * 0.40;
                let finalWinAmt = state.bet + userProfitShare;

                userBalance += finalWinAmt;
                updateBalanceUI();
                
                btn.innerHTML = 'Won<br>₹' + finalWinAmt.toFixed(2);
                btn.classList.remove('cashout');
                state.isPlaying = false;
                state.hasWon = true;
            }
        }

        socket.on('initHistory', (history) => {
            if (history && Array.isArray(history) && history.length > 0) {
                previousRounds = history;
                saveAndTrimHistory();
            }
        });

        socket.on('roundStarted', () => {
            if (countdownInterval) clearInterval(countdownInterval);
            multiplierDisplay.className = 'waiting-timer';
            multiplierDisplay.textContent = '1.00x';
            multiplierDisplay.style.color = '#00f2fe';
            particles = [];
            [1, 2].forEach(pId => {
                if (panelState[pId].hasWon) {
                    updateButtonText(pId);
                }
            });
        });

        socket.on('multiplierUpdate', (mult) => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            currentMultiplierVal = parseFloat(mult) || 1.00;
            multiplierDisplay.className = '';
            multiplierDisplay.textContent = currentMultiplierVal.toFixed(2) + 'x';

            // Dynamic Multiplier Color Change (உயர்ந்த மல்டிபிளையருக்கு கலர் மாறும்)
            if (currentMultiplierVal >= 10.0) {
                multiplierDisplay.style.color = '#ff00ff'; // Gold/Purple Glow
            } else if (currentMultiplierVal >= 2.0) {
                multiplierDisplay.style.color = '#2ed573'; // Green
            } else {
                multiplierDisplay.style.color = '#00f2fe'; // Blue
            }

            let progress = Math.min((currentMultiplierVal - 1.00) / 4.00, 0.85);
            drawSciFiJetFlight(progress);

            [1, 2].forEach(pId => {
                let state = panelState[pId];
                let btn = document.getElementById('actionBtn' + pId);
                if (state.isPlaying) {
                    let currentWin = (state.bet * currentMultiplierVal).toFixed(2);
                    btn.innerHTML = 'Cashout<br>₹' + currentWin + ' (' + currentMultiplierVal.toFixed(2) + 'x)';
                    
                    if (state.isAuto) {
                        let target = parseFloat(document.getElementById('autoVal' + pId).value) || 2.0;
                        if (currentMultiplierVal >= target) {
                            handleAction(pId);
                        }
                    }
                }
            });
        });

        socket.on('gameCrashed', (data) => {
            let cleanCrash = 1.00;
            let serverHistory = null;

            if (typeof data === 'object' && data !== null) {
                cleanCrash = parseFloat(data.crashPoint) || 1.00;
                if (data.history) serverHistory = data.history;
            } else {
                cleanCrash = parseFloat(data) || 1.00;
            }

            multiplierDisplay.textContent = 'Crashed: ' + cleanCrash.toFixed(2) + 'x';
            multiplierDisplay.className = 'crashed-text';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];

            [1, 2].forEach(pId => {
                if (panelState[pId].isPlaying) {
                    panelState[pId].isPlaying = false;
                    updateButtonText(pId);
                }
            });

            if (serverHistory) {
                previousRounds = serverHistory;
            } else {
                previousRounds.unshift(cleanCrash);
            }
            
            saveAndTrimHistory();

            if (countdownInterval) clearInterval(countdownInterval);
            let timerValue = 9;
            multiplierDisplay.className = 'waiting-timer';
            multiplierDisplay.textContent = 'Next in ' + timerValue;

            countdownInterval = setInterval(() => {
                timerValue--;
                if (timerValue >= 1) {
                    multiplierDisplay.textContent = 'Next in ' + timerValue;
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    multiplierDisplay.textContent = 'Waiting...';
                }
            }, 1000);
        });

        function saveAndTrimHistory() {
            if (previousRounds.length > 100) {
                previousRounds = previousRounds.slice(0, 100);
            }
            localStorage.setItem('dream66_jetx_history', JSON.stringify(previousRounds));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            let html = '';
            previousRounds.forEach(val => {
                let formattedVal = parseFloat(val).toFixed(2);
                html += `<div class="history-pill">${formattedVal}x</div>`;
            });
            historyBar.innerHTML = html;
        }

        // --- Advance Sci-Fi Canvas Flight Drawing ---
        function drawSciFiJetFlight(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Space Stars Background
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            let x = canvas.width * progress;
            let y = canvas.height - (canvas.height * progress * 0.8);

            // 2. Add Particle Trail (நெருப்பு/புகை)
            particles.push({
                x: x - 8,
                y: y + 4,
                size: Math.random() * 4 + 2,
                alpha: 1,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 1.5 + 0.5
            });

            // Draw Particles
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, ${Math.floor(Math.random() * 150)}, 0, ${p.alpha})`;
                ctx.fill();

                p.x -= 2;
                p.y += p.vy;
                p.alpha -= 0.04;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            // 3. Laser Glow Line
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(x, y);
            ctx.strokeStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset blur

            // 4. Jet Emoji / Icon
            ctx.font = '22px Arial';
            ctx.fillText('🚀', x - 10, y + 8);
        }
    </script>
</body>
</html>
